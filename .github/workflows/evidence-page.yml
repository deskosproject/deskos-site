name: evidence-page

# Regenerate the evidence page after a promotion, so the page describes the
# digest `:stable` actually serves, and stamp that digest into the home page.
# Both ask quay which digest `:stable` is; the evidence page reads that digest's
# index in the public bucket. They are committed, not rendered on request.
#
# Weekly, after the supply-chain schedule and the promotion it triggers, plus on
# demand. It opens a pull request: the site is reviewed like the rest of the
# repository, and a page that changes silently is a page nobody checked.
on:
  schedule:
    # Daily, not weekly. GitHub's scheduler runs hours late and drops ticks, so a
    # weekly run can land before the promotion it is meant to describe and leave
    # the page a week behind. Running daily costs nothing when there is no change
    # (the workflow exits without a diff) and catches up within a day when the
    # Monday gate or its promotion lands late.
    # 10:00 UTC. The timezone is named so nobody has to guess which 10:00.
    - cron: '0 10 * * *'
      timezone: "Etc/UTC"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evidence-page
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Regenerate the page from :stable
        run: python3 tools/build-evidence.py

      - name: Name the published digest on the home page
        # The home page says which digest a reader can verify. Writing it by hand
        # would be stale the day after a publication, so this resolves :stable
        # and replaces the value between the markers.
        run: python3 tools/stamp-digest.py

      - name: Open the update when the digest moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "the page already describes :stable"
            exit 0
          fi
          git config user.name "deskos-evidence"
          git config user.email "release@deskos.org"
          # The branch names the digest, so a second run for the same digest
          # does not fail pushing over a branch that is already in review.
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' evidence/index.html | head -1 | tr ':' '-')"
          branch="evidence/stable-${digest:-$(date -u +%Y%m%d)}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already waits for review; nothing to open"
            exit 0
          fi
          git checkout -b "$branch"
          git add evidence/index.html index.html
          git commit -m "docs(evidence): follow :stable"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(evidence): follow :stable" \
            --body "Regenerated from the digest \`:stable\` serves. The page is a static file; this is the only thing that changes it."
