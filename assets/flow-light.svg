<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none" role="img" aria-label="A YAML sheet is compiled into a Containerfile, which becomes a stack of image layers">
  <g stroke="#3e403a" stroke-width="1.6">
    <!-- sheet 1 -->
    <path d="M60 50 h200 l40 40 v160 h-240 z"/>
    <path d="M260 50 v40 h40"/>
    <!-- sheet 2 -->
    <path d="M430 40 h260 l40 40 v180 h-300 z"/>
    <path d="M690 40 v40 h40"/>
  </g>

  <!-- sheet 1 contents -->
  <g stroke="#b7b2a4" stroke-width="3" stroke-linecap="round">
    <path d="M86 104 h96"/>
    <path d="M86 128 h148"/>
    <path d="M86 152 h120"/>
  </g>
  <path d="M78 96 v80" stroke="#2f6fed" stroke-width="3"/>

  <!-- sheet 2 contents -->
  <g stroke="#d0cbbd" stroke-width="3" stroke-linecap="round">
    <path d="M456 104 h188"/>
    <path d="M456 132 h150"/>
    <path d="M456 160 h176"/>
    <path d="M456 188 h120"/>
  </g>
  <g>
    <circle cx="446" cy="104" r="4" fill="#2f6fed"/>
    <circle cx="446" cy="132" r="4" fill="#1f8a52"/>
    <circle cx="446" cy="160" r="4" fill="#6d4fd0"/>
    <circle cx="446" cy="188" r="4" fill="#3e403a"/>
  </g>

  <!-- arrows -->
  <g stroke="#2f6fed" stroke-width="1.8" stroke-linecap="round">
    <path d="M318 150 h58"/>
    <path d="M376 144 l10 6 -10 6"/>
    <path d="M750 150 h58"/>
    <path d="M808 144 l10 6 -10 6"/>
  </g>

  <!-- image stack -->
  <g stroke="#2f6fed" stroke-width="2">
    <path d="M880 128 l220 0 l40 -20 l-220 0 z"/>
    <path d="M880 128 v14 l220 0 l0 -14"/>
    <path d="M1100 128 l40 -20 l0 14 l-40 20"/>

    <path d="M856 166 l220 0 l40 -20 l-220 0 z"/>
    <path d="M856 166 v14 l220 0 l0 -14"/>
    <path d="M1076 166 l40 -20 l0 14 l-40 20"/>

    <path d="M832 204 l220 0 l40 -20 l-220 0 z"/>
    <path d="M832 204 v14 l220 0 l0 -14"/>
    <path d="M1052 204 l40 -20 l0 14 l-40 20"/>
  </g>

  <!-- dimension marks -->
  <g stroke="#d0cbbd" stroke-width="1" stroke-dasharray="2 5">
    <path d="M60 268 h1080"/>
  </g>
</svg>
